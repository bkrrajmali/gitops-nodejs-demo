apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nodejs-app
  namespace: argocd            # Applications always live in the argocd namespace
spec:
  project: default
  source:
    repoURL: https://github.com/<your-user>/gitops-nodejs-demo.git
    targetRevision: main       # branch, tag or commit to track
    path: k8s                  # folder with the manifests
  destination:
    server: https://kubernetes.default.svc   # the same cluster Argo CD runs in
    namespace: nodejs-app
  syncPolicy:
    automated:
      prune: true              # delete resources removed from Git
      selfHeal: true           # undo manual changes in the cluster
    syncOptions:
      - CreateNamespace=true   # create nodejs-app namespace if missing